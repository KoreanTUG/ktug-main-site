# Site settings
title: 한글 TeX 사용자 모임
description: TeX은 생각을 가장 정확하고 아름답게 표현하는 사람들의 언어입니다.
baseurl: "/ktug-main-site" # the subpath of your site, e.g. /blog
url: "https://koreantug.github.io" # the base hostname & protocol for your site

# Build settings
markdown: kramdown
highlighter: rouge
permalink: pretty
kramdown:
  syntax_highlighter: rouge
  parse_block_html: true
  parse_span_html: true
  syntax_highlighter_opts:
    block:
      line_numbers: false

# Collections
collections:
  pages:
    output: true
  getting_started:
    output: true
    permalink: /getting-started/:name/

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache
  - vendor/gems
  - vendor/ruby
  - .git
  - .gitignore
  - README.md
  - closet/
  - scripts/
  - _config_dev.yml
  - CLAUDE.md

# Plugins (GitHub Pages supported plugins)
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Theme settings
theme: null

# Language
lang: ko
locale: ko_KR

# Defaults
defaults:
  - scope:
      path: "_pages"
      type: "pages"
    values:
      layout: "page"
  - scope:
      path: "_getting_started"
      type: "getting_started"
    values:
      layout: "tutorial"


# Discourse 포럼(최근 게시물). url이 비어 있으면 메인 화면의 '최근 게시물' 영역을 만들지 않는다.
# 로컬 시험 주소는 _config_dev.yml(git 제외)에 둔다:
#   bundle exec jekyll serve --host localhost --config _config.yml,_config_dev.yml
# 게시판 id는 Discourse의 /c/<slug>/<id> 주소에서 확인한다.
discourse:
  url: "https://discourse.ktug.org"
  topics_per_category: 5
  categories:
    - name: KTUG 마당
      slug: ktug
      id: 5
      icon: megaphone          # _includes/icons/<icon>.svg
    - name: Q&A 마당
      slug: qna
      id: 6
      icon: message-circle-question-mark
    - name: FAQ 마당
      slug: faq
      id: 7
      icon: list-checks
